name: build
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      repo:
        description: 9router git url
        default: https://github.com/giienew/9router-pro.git
      ref:
        description: 9router branch or tag
        default: master
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/zeroxinvictus/9routerpro-egg:latest
          build-args: |
            NINE_ROUTER_REPO=${{ inputs.repo || 'https://github.com/giienew/9router-pro.git' }}
            NINE_ROUTER_REF=${{ inputs.ref || 'master' }}
